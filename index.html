<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #6d0f18;
    }

    #start {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6d0f18;
      z-index: 10;
    }

    #openButton {
      background: transparent;
      color: #d9b66f;
      border: 1.5px solid #d9b66f;
      border-radius: 50px;
      padding: 16px 55px;
      font-family: Georgia, serif;
      font-size: 28px;
      letter-spacing: 3px;
      cursor: pointer;
    }

    #card {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #6d0f18;
    }
  </style>
</head>

<body>

  <div id="start">
    <button id="openButton">OPEN</button>
  </div>

  <iframe
    id="card"
    src="https://www.invitedrop.com/i/896d8a99-e9eb-4ed6-8505-0fb7fe46d767"
    allow="autoplay; fullscreen"
  ></iframe>

  <audio id="music" loop preload="auto">
    <source src="Arose%20mahtab%20.mov" type="video/quicktime">
  </audio>

  <script>
    const button = document.getElementById("openButton");
    const start = document.getElementById("start");
    const card = document.getElementById("card");
    const music = document.getElementById("music");

    button.addEventListener("click", function () {
      music.currentTime = 0;

      music.play().catch(function(error) {
        console.log("Audio error:", error);
      });

      start.style.display = "none";
      card.style.display = "block";
    });
  </script>

</body>
</html>
