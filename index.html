<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #6d0f18;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #openButton {
      background: transparent;
      color: #d9b66f;
      border: 1.5px solid #d9b66f;
      border-radius: 50px;
      padding: 17px 60px;
      font-family: Georgia, serif;
      font-size: 28px;
      letter-spacing: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button id="openButton">OPEN</button>

  <audio id="music" preload="auto">
    <source src="Arose%20mahtab%20.mov">
  </audio>

  <script>
    const button = document.getElementById("openButton");
    const music = document.getElementById("music");

    button.addEventListener("click", function () {

      music.play().catch(() => {});

      setTimeout(function () {
        window.location.href =
          "https://www.invitedrop.com/i/896d8a99-e9eb-4ed6-8505-0fb7fe46d767";
      }, 300);

    });
  </script>

</body>
</html>
